[package]
name = "floppapad_firmware"
version = "0.0.1"
edition = "2021"

[target.thumbv6m-none-eabi.dependencies]
rp2040-hal = { version = "0.10", features = ["critical-section-impl"] }
rp2040-boot2 = "0.3"
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "0.2"
usb-device = { version = "0.3", features = ["defmt"] }
usbd-hid = "0.8"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
ssd1306 = "0.8"

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
